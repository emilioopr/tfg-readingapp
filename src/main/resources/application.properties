spring.application.name=reading-app

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/readingapp}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
# Sin conexiones inactivas abiertas: así Neon puede suspender la base de datos cuando no hay uso y no gasta horas de cómputo
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
# Carga las relaciones perezosas en lotes (IN de hasta 50 ids) en vez de una consulta por elemento
spring.jpa.properties.hibernate.default_batch_fetch_size=50

server.port=${PORT:8080}
# Comprime las respuestas JSON (el catálogo pasa de ~110 KB a unos pocos KB)
server.compression.enabled=true
server.compression.min-response-size=2KB

google.books.api.key=${GOOGLE_BOOKS_KEY}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}